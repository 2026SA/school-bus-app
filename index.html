<style>
:root{--bg:#f3f6f8;--card:#fff;--ink:#1f2933;--muted:#677482;--primary:#173f5f;--accent:#2e6f95;--ok:#2f855a;--warn:#b7791f;--danger:#c53030;--line:#d9e1e8;--soft:#eaf1f6;--shadow:0 7px 20px rgba(18,50,74,.09)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:10px;font-weight:900}.brand-home{display:flex;align-items:center;gap:10px;background:transparent;border:0;padding:0;color:inherit;font:inherit;cursor:pointer}.brand-home:hover .brand-mark{transform:scale(1.04)}.brand-mark{width:40px;height:40px;border-radius:11px;background:var(--primary);display:grid;place-items:center;color:#fff;font-size:21px}.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.container{width:min(1200px,calc(100% - 24px));margin:18px auto 40px}.grid{display:grid;gap:14px}.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}.card h2,.card h3{margin:0 0 10px}.small{font-size:13px}.muted{color:var(--muted)}.big{font-size:clamp(28px,6vw,44px);font-weight:950;line-height:1.1}.kicker{font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.04em}
.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:850;background:var(--primary);color:#fff;min-height:42px}.btn.secondary{background:#fff;color:var(--primary);border:1px solid var(--line)}.btn.ghost{background:var(--soft);color:var(--primary)}.btn.ok{background:var(--ok)}.btn.warn{background:var(--warn)}.btn.danger{background:var(--danger)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn-group{display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--soft);padding:6px 10px;font-size:12px;font-weight:850}.pill.ok{background:#e5f4ec;color:#256448}.pill.warn{background:#fff5d9;color:#8a6517}.pill.danger{background:#fdeaea;color:#9f2c2c}.notice{border-left:5px solid var(--accent);background:#edf6fb;padding:12px 14px;border-radius:10px;margin:10px 0}.notice.warn{border-left-color:var(--warn);background:#fff8e7}.notice.danger{border-left-color:var(--danger);background:#fff0f0}.notice.ok{border-left-color:var(--ok);background:#eef8f2}
label{display:block;font-size:13px;font-weight:850;margin-bottom:5px}input,select,textarea{width:100%;border:1px solid #bcc9d4;border-radius:10px;padding:10px 11px;background:#fff;color:var(--ink)}textarea{min-height:90px;resize:vertical}.form-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.login-shell{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(560px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}.demo-box{margin-top:18px;padding:14px;background:var(--soft);border-radius:12px}.demo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.user-strip{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.avatar{width:42px;height:42px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:950;color:var(--primary)}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin:14px 0}.tabs button{white-space:nowrap}.choice-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.choice{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:12px;padding:14px 8px;font-weight:950}.choice.active{background:var(--primary);color:#fff;border-color:var(--primary)}.day-list{display:grid;gap:8px}.day-row{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff}.stat{padding:12px;border-radius:12px;background:var(--soft)}.stat b{font-size:24px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:12px;color:var(--muted);background:#f8fafb;position:sticky;top:0}.route-card{border-top:6px solid var(--accent)}.boarding-row{display:flex;align-items:center;gap:9px;padding:9px;border:1px solid var(--line);border-radius:10px;margin:6px 0;background:#fff}.boarding-row.selected{background:#e9f7ef;border-color:#b7dfc7}.boarding-row.confirmed{background:#eef3f7}.boarding-row input{width:20px;height:20px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}.capacity-badge{font-weight:900}.capacity-ok{color:var(--ok)}.capacity-warn{color:var(--warn)}.capacity-danger{color:var(--danger)}
.reception-shell{min-height:100vh;background:#eef3f7;padding:22px}.reception-card{width:min(900px,100%);margin:auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow)}.scan-area{border:3px dashed #a8b8c5;border-radius:18px;padding:34px;text-align:center;background:#f8fafb}.scan-icon{font-size:64px}.reception-display{min-height:100vh;background:#0f2f48;color:#fff;padding:22px}.display-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}.display-time{font-size:clamp(54px,10vw,104px);font-weight:950;letter-spacing:-.04em}.display-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.display-route{background:#fff;color:#172b3a;border-radius:18px;padding:16px}.display-route h2{margin:0 0 10px;font-size:clamp(18px,3vw,28px)}.display-names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.display-name{background:#eaf1f6;padding:9px 10px;border-radius:10px;font-weight:900;font-size:clamp(14px,2.2vw,20px)}.display-footer{margin-top:14px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px;opacity:.9}.countdown{font-size:clamp(32px,6vw,70px);font-weight:950;text-align:center}.countdown.warn{color:#ffe08a}.countdown.danger{color:#ffb0b0}.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:grid;place-items:center;padding:16px}.modal{width:min(650px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:18px}.toast{position:fixed;right:16px;bottom:16px;z-index:80;max-width:min(440px,calc(100% - 32px));padding:13px 16px;border-radius:12px;background:#142d3f;color:#fff;box-shadow:var(--shadow);font-weight:750}.master-list{display:grid;gap:8px}.master-item{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}.qr-token{font-family:ui-monospace,Consolas,monospace;background:#f4f6f8;border:1px solid var(--line);padding:6px 8px;border-radius:8px;display:inline-block}.section-title{margin-top:22px}.no-print{display:block}hr{border:0;border-top:1px solid var(--line);margin:16px 0}
@media(max-width:850px){.grid-4,.grid-3,.grid-2,.display-grid{grid-template-columns:1fr}.form-row{grid-template-columns:1fr}.choice-row{grid-template-columns:repeat(2,minmax(0,1fr))}.day-row{grid-template-columns:1fr}.display-names{grid-template-columns:1fr}.topbar{align-items:flex-start}}@media print{.topbar,.tabs,.no-print,.btn{display:none!important}body{background:#fff}.container{width:100%;margin:0}.card{box-shadow:none;border-color:#bbb}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast hidden"></div>
<script src="qrcode-local.js"></script>
<script>
"use strict";
const DEMO_DAY="2026-10-05";
const DEFAULT_TIMES=["13:30","15:10","16:30","18:00"];
const DEFAULT_ROUTES=[
 {id:"R1",name:"天坪方面",stops:["新大王橋","馬瀬","万手野","馬瀬古屋"]},
 {id:"R2",name:"立川・川口方面",stops:["野竹橋","川口","川口分岐","津家","大杉橋元"]},
 {id:"R3",name:"岩原・豊永方面",stops:["川戸","柳野","大杉橋","永渕","豊永公民館","大田口電所","穴内"]},
 {id:"R4",name:"西峰・大田口・穴内方面",stops:["減長上","落合","栗生","豊永駅","ふれあいセンター","大田口駅"]}
];
const BASE_STUDENTS=[
 {id:"S001",pin:"A1B2",qr:"QR-S001-X7K2",name:"山田 太郎",grade:4,routeId:"R1",stop:"馬瀬",busCommuter:true},
 {id:"S002",pin:"B2C3",qr:"QR-S002-P9M4",name:"佐藤 花子",grade:6,routeId:"R1",stop:"万手野",busCommuter:true},
 {id:"S003",pin:"C3D4",qr:"QR-S003-Q2F8",name:"高橋 海斗",grade:7,routeId:"R1",stop:"新大王橋",busCommuter:true},
 {id:"S004",pin:"D4E5",qr:"QR-S004-L5H3",name:"森 結衣",grade:9,routeId:"R1",stop:"馬瀬古屋",busCommuter:false},
 {id:"S005",pin:"E5F6",qr:"QR-S005-A7D1",name:"小川 蓮",grade:5,routeId:"R2",stop:"川口",busCommuter:true},
 {id:"S006",pin:"F6G7",qr:"QR-S006-B8V5",name:"岡田 美咲",grade:8,routeId:"R2",stop:"津家",busCommuter:false},
 {id:"S007",pin:"G7H8",qr:"QR-S007-C6Z9",name:"中村 翼",grade:3,routeId:"R2",stop:"野竹橋",busCommuter:true},
 {id:"S008",pin:"H8J9",qr:"QR-S008-N4S2",name:"井上 葵",grade:9,routeId:"R2",stop:"大杉橋元",busCommuter:false},
 {id:"S009",pin:"J9K1",qr:"QR-S009-R3W6",name:"松本 悠真",grade:4,routeId:"R3",stop:"柳野",busCommuter:true},
 {id:"S010",pin:"K1L2",qr:"QR-S010-T8Y1",name:"藤田 彩",grade:7,routeId:"R3",stop:"豊永公民館",busCommuter:true},
 {id:"S011",pin:"L2M3",qr:"QR-S011-U2J7",name:"山本 蒼",grade:8,routeId:"R3",stop:"穴内",busCommuter:false},
 {id:"S012",pin:"M3N4",qr:"QR-S012-E5K8",name:"清水 凛",grade:6,routeId:"R3",stop:"川戸",busCommuter:true},
 {id:"S013",pin:"N4P5",qr:"QR-S013-H7N2",name:"田中 陽翔",grade:5,routeId:"R4",stop:"豊永駅",busCommuter:true},
 {id:"S014",pin:"P5Q6",qr:"QR-S014-M3C9",name:"前田 莉子",grade:8,routeId:"R4",stop:"大田口駅",busCommuter:false},
 {id:"S015",pin:"Q6R7",qr:"QR-S015-G6P4",name:"池田 健",grade:2,routeId:"R4",stop:"落合",busCommuter:true},
 {id:"S016",pin:"R7S8",qr:"QR-S016-V1B6",name:"西村 心",grade:9,routeId:"R4",stop:"ふれあいセンター",busCommuter:false}
];
const PARENTS=[
 {id:"P001",pin:"P1A1",name:"山田 保護者①",studentId:"S001"},{id:"P002",pin:"P1A2",name:"山田 保護者②",studentId:"S001"},
 ...BASE_STUDENTS.slice(1).map((s,i)=>({id:`P${String(i+3).padStart(3,"0")}`,pin:`P${(i+2)%10}${String.fromCharCode(65+(i%20))}${(i+3)%10}`,name:`${s.name.split(" ")[0]} 保護者`,studentId:s.id}))
];
const TEACHERS=[
 {id:"T001",pin:"T1E1",qr:"QR-T001-TEACH",name:"先生A",role:"teacher"},
 {id:"T002",pin:"T2E2",qr:"QR-T002-TEACH",name:"先生B",role:"teacher"}
];
const ADMINS=[
 {id:"A001",pin:"A1D1",qr:"QR-A001-ADMIN",name:"管理者A",role:"admin"},
 {id:"A002",pin:"A2D2",qr:"QR-A002-ADMIN",name:"管理者B",role:"admin"},
 {id:"A003",pin:"A3D3",qr:"QR-A003-ADMIN",name:"管理者C",role:"admin"}
];
const app=document.getElementById("app");
let session=JSON.parse(sessionStorage.getItem("busSessionV04")||"null");
let currentTab="today";
let demoTime=localStorage.getItem("busDemoTimeV04")||"08:35";
let displayTimer=null,displayIndex=0,boardingDraft={};
function deepClone(x){return JSON.parse(JSON.stringify(x))}
function makeInitialDb(){
 const d={students:deepClone(BASE_STUDENTS),routes:deepClone(DEFAULT_ROUTES),times:[...DEFAULT_TIMES],activeTimes:{[DEMO_DAY]:[...DEFAULT_TIMES]},capacities:{},schedules:{},repeats:{},boarding:{},histories:[],sent:{},teacherAccounts:deepClone(TEACHERS),adminAccounts:deepClone(ADMINS),settings:{deadline:"08:50",reminder:"08:40",reservationDays:30,displaySeconds:5,documentText:"スクールバス乗車管理システムの利用に必要なID・PIN・QRコードをお知らせします。紛失時は学校へご連絡ください。"}};
 DEFAULT_ROUTES.forEach(r=>DEFAULT_TIMES.forEach(t=>d.capacities[`${r.id}__${t}`]=6));
 const seed={S001:"15:10",S003:"18:00",S004:"18:00",S005:"13:30",S006:"16:30",S007:"15:10",S008:"18:00",S009:"16:30",S011:"18:00",S012:"13:30",S013:"15:10",S014:"18:00",S015:"16:30",S016:"18:00"};
 Object.entries(seed).forEach(([sid,time])=>d.schedules[`${DEMO_DAY}__${sid}`]={value:time,status:"requested",by:"system",byName:"繰り返し設定",reason:"繰り返し設定",updatedAt:`${DEMO_DAY} 07:00`,requestedAt:`${DEMO_DAY} 07:00`});
 recalcCapacity(d,DEMO_DAY);
 return d;
}
function db(){const raw=localStorage.getItem("schoolBusProtoV04");if(raw)return JSON.parse(raw);const d=makeInitialDb();save(d);return d}
function save(d){localStorage.setItem("schoolBusProtoV04",JSON.stringify(d))}
function resetDemo(){if(confirm("試作データを初期状態に戻しますか？")){localStorage.removeItem("schoolBusProtoV04");boardingDraft={};toast("初期化しました");render()}}
function key(day,sid){return `${day}__${sid}`}
function capKey(routeId,time){return `${routeId}__${time}`}
function minOf(hm){const [h,m]=hm.split(":").map(Number);return h*60+m}
function fmtDate(day){const dt=new Date(day+"T00:00:00");return `${dt.getMonth()+1}月${dt.getDate()}日（${"日月火水木金土"[dt.getDay()]}）`}
function addDays(day,n){const dt=new Date(day+"T00:00:00");dt.setDate(dt.getDate()+n);return dt.toISOString().slice(0,10)}
function schoolDays(n=22){const out=[];let d=DEMO_DAY,i=0;while(out.length<n&&i<50){const dt=new Date(d+"T00:00:00");if(dt.getDay()!==0&&dt.getDay()!==6)out.push(d);d=addDays(d,1);i++}return out}
function roleLabel(r){return ({student:"児童・生徒",parent:"保護者",teacher:"先生",admin:"管理者",display:"玄関ディスプレイ",reception:"QR受付"})[r]||r}
function routeName(id){return db().routes.find(r=>r.id===id)?.name||id}
function studentById(id){return db().students.find(s=>s.id===id)}
function currentStudent(){if(!session)return null;if(session.role==="student")return studentById(session.id);if(session.role==="parent"){const p=PARENTS.find(p=>p.id===session.id);return studentById(p?.studentId)}return null}
function getSchedule(day,sid){return db().schedules[key(day,sid)]||null}
function isLocked(day){return day===DEMO_DAY&&minOf(demoTime)>=minOf(db().settings.deadline)}
function activeTimes(day=DEMO_DAY){const d=db();return d.activeTimes[day]||d.times}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function toast(msg,ms=3200){const t=document.getElementById("toast");t.textContent=msg;t.classList.remove("hidden");clearTimeout(window._toast);window._toast=setTimeout(()=>t.classList.add("hidden"),ms)}
function modal(html){const el=document.createElement("div");el.id="modalWrap";el.className="modal-backdrop";el.innerHTML=`<div class="modal">${html}</div>`;document.body.appendChild(el)}
function closeModal(){document.getElementById("modalWrap")?.remove()}
function logHistory(d,item){d.histories.push({...item,timestamp:`${DEMO_DAY} ${demoTime}`})}
function recalcCapacity(d,day){
 const daySchedules=Object.entries(d.schedules).filter(([k])=>k.startsWith(day+"__"));
 daySchedules.forEach(([,s])=>{if(s.value!=="none")s.status="requested"});
 d.routes.forEach(route=>d.times.forEach(time=>{
  const riders=d.students.filter(st=>st.routeId===route.id).map(st=>({st,sch:d.schedules[key(day,st.id)]})).filter(x=>x.sch?.value===time);
  const cap=Number(d.capacities[capKey(route.id,time)]||0);
  const commuters=riders.filter(x=>x.st.busCommuter);
  commuters.forEach(x=>x.sch.status="confirmed");
  const available=Math.max(0,cap-commuters.length);
  const general=riders.filter(x=>!x.st.busCommuter).sort((a,b)=>a.st.grade-b.st.grade || String(a.sch.requestedAt||"").localeCompare(String(b.sch.requestedAt||"")));
  general.forEach((x,i)=>x.sch.status=i<available?"confirmed":"rejected");
 }));
}
function loginView(){app.innerHTML=`<div class="login-shell"><div class="login-card"><div class="brand"><div class="brand-mark">🚌</div><div><div>スクールバス乗車管理</div><div class="muted small">PWA 試作版 v0.6</div></div></div><div class="notice" style="margin-top:16px">実在の個人情報は使用していません。データはこのブラウザ内だけに保存されます。</div><div class="form-row"><div><label>ユーザーID</label><input id="loginId" placeholder="例 S001"></div><div><label>4桁英数PIN</label><input id="loginPin" maxlength="4" placeholder="例 A1B2"></div></div><button class="btn" style="width:100%;margin-top:12px" onclick="login()">ログイン</button><div class="demo-box"><b>デモログイン</b><div class="demo-grid"><button class="btn secondary" onclick="quickLogin('S001','A1B2')">児童・生徒</button><button class="btn secondary" onclick="quickLogin('P001','P1A1')">保護者</button><button class="btn secondary" onclick="quickLogin('T001','T1E1')">先生</button><button class="btn secondary" onclick="quickLogin('A001','A1D1')">管理者</button></div><div class="demo-grid"><button class="btn ghost" onclick="openReception()">QR受付専用画面</button><button class="btn ghost" onclick="openDisplay()">玄関ディスプレイ</button></div></div></div></div>`}
function quickLogin(id,pin){document.getElementById("loginId").value=id;document.getElementById("loginPin").value=pin;login()}
function login(){const id=document.getElementById("loginId").value.trim().toUpperCase(),pin=document.getElementById("loginPin").value.trim().toUpperCase();const d=db();let u=d.students.find(x=>x.id===id&&x.pin===pin);if(u)session={id:u.id,name:u.name,role:"student"};if(!u){u=PARENTS.find(x=>x.id===id&&x.pin===pin);if(u)session={id:u.id,name:u.name,role:"parent"}}if(!u){u=d.teacherAccounts.find(x=>x.id===id&&x.pin===pin);if(u)session={id:u.id,name:u.name,role:"teacher"}}if(!u){u=d.adminAccounts.find(x=>x.id===id&&x.pin===pin);if(u)session={id:u.id,name:u.name,role:"admin"}}if(!u){toast("IDまたはPINが違います");return}sessionStorage.setItem("busSessionV04",JSON.stringify(session));currentTab="today";render()}
function logout(){session=null;sessionStorage.removeItem("busSessionV04");if(displayTimer)clearInterval(displayTimer);loginView()}
function openDisplay(){session={id:"DISPLAY",name:"玄関ディスプレイ",role:"display"};sessionStorage.setItem("busSessionV04",JSON.stringify(session));render()}
function openReception(){session={id:"RECEPTION",name:"QR受付",role:"reception"};sessionStorage.setItem("busSessionV04",JSON.stringify(session));render()}
function topBar(){return `<div class="topbar"><button class="brand-home" onclick="goHome()" title="トップ画面へ"><div class="brand-mark">🚌</div><div>スクールバス</div></button><div class="top-actions"><span class="pill">${roleLabel(session.role)}：${esc(session.name)}</span><label class="small" style="margin:0">デモ時刻 <select onchange="setDemoTime(this.value)" style="width:auto;margin-left:4px">${["08:35","08:45","09:10","13:20","13:25","15:00","15:05","16:20","16:25","17:50","17:55"].map(t=>`<option ${t===demoTime?"selected":""}>${t}</option>`).join("")}</select></label><button class="btn secondary" onclick="logout()">ログアウト</button></div></div>`}
function setDemoTime(v){demoTime=v;localStorage.setItem("busDemoTimeV04",v);render()}
function render(){try{if(!session){loginView();return}if(session.role==="display"){renderDisplay();return}if(session.role==="reception"){renderReception();return}if(["student","parent"].includes(session.role))renderFamily();else renderStaff();maybeReminder()}catch(e){app.innerHTML=`<div class="login-shell"><div class="login-card"><h2>起動エラー</h2><div class="notice danger">${esc(e.message)}</div><button class="btn" onclick="logout()">ログイン画面へ戻る</button></div></div>`;console.error(e)}}
function maybeReminder(){if(!["student","parent"].includes(session.role))return;const s=currentStudent();if(!s?.busCommuter)return;const sch=getSchedule(DEMO_DAY,s.id);const m=minOf(demoTime),rem=minOf(db().settings.reminder),dl=minOf(db().settings.deadline);if(!sch&&m>=rem&&m<dl)setTimeout(()=>toast(`⚠ 本日の申告が未完了です。${db().settings.deadline}までに登録してください。`,6000),200)}
function statusLabel(sch,student){if(!sch)return `<span class="pill warn">未申告</span>`;if(sch.value==="none")return `<span class="pill">乗らない</span>`;if(!student.busCommuter){if(sch.status==="confirmed")return `<span class="pill ok">${sch.value} 乗車確定</span>`;if(sch.status==="rejected")return `<span class="pill danger">${sch.value} 満席・利用不可</span>`;return `<span class="pill warn">${sch.value} 乗車希望</span>`}return `<span class="pill ok">${sch.value}便</span>`}
function renderFamily(){const s=currentStudent();app.innerHTML=topBar()+`<main class="container"><div class="user-strip"><div class="avatar">${esc(s.name.slice(0,1))}</div><div><b>${esc(s.name)}</b> <span class="muted">${s.grade}年</span><div class="small muted">${esc(routeName(s.routeId))}／${esc(s.stop)}／${s.busCommuter?"バス通学":"一般利用"}</div></div></div><div class="tabs"><button class="btn ${currentTab==="today"?"":"secondary"}" onclick="familyTab('today')">今日</button><button class="btn ${currentTab==="month"?"":"secondary"}" onclick="familyTab('month')">1か月予定</button><button class="btn ${currentTab==="repeat"?"":"secondary"}" onclick="familyTab('repeat')">繰り返し</button><button class="btn ${currentTab==="profile"?"":"secondary"}" onclick="familyTab('profile')">路線・降車場所</button><button class="btn ${currentTab==="history"?"":"secondary"}" onclick="familyTab('history')">履歴</button></div><div id="familyContent"></div></main>`;({today:familyToday,month:familyMonth,repeat:familyRepeat,profile:familyProfile,history:familyHistory}[currentTab]||familyToday)(s)}
function familyTab(t){currentTab=t;render()}
function familyToday(s){const sch=getSchedule(DEMO_DAY,s.id),lock=isLocked(DEMO_DAY),boarding=db().boarding[key(DEMO_DAY,s.id)];let message="";if(!s.busCommuter&&sch?.status==="rejected")message=`<div class="notice danger"><b>満席のため本日は利用できません。</b><br>バス通学者を優先し、一般利用者は低学年・申込の早い順で確定します。</div>`;else if(!s.busCommuter&&sch?.status==="confirmed")message=`<div class="notice ok"><b>乗車できます。</b> 8:50時点の定員判定で確定しています。</div>`;let boardText="";if(sch?.value==="18:00")boardText=`<div class="notice">18:00便は学校による乗車確認対象外です。</div>`;else if(boarding?.confirmed)boardText=`<div class="notice ok"><b>🟢 ${boarding.time} 乗車確認済み</b></div>`;else if(sch?.value&&sch.value!=="none")boardText=`<div class="notice warn">乗車予定（未確認）</div>`;document.getElementById("familyContent").innerHTML=`${!sch&&s.busCommuter?`<div class="notice danger"><b>本日の申告が未完了です。</b></div>`:""}${message}<div class="grid grid-2"><section class="card"><div class="kicker">${fmtDate(DEMO_DAY)}</div><h2>今日の下校</h2><div class="big">${sch?.value==="none"?"乗らない":sch?.value?sch.value+"便":"未申告"}</div><div class="muted">${esc(routeName(s.routeId))}／降車：${esc(s.stop)}</div><div style="margin-top:8px">${statusLabel(sch,s)}</div>${lock?`<div class="notice warn">本日の本人・保護者受付は${db().settings.deadline}で終了しています。</div>`:""}</section><section class="card"><h3>乗車状況</h3>${boardText||`<div class="muted">乗車予定を登録すると表示されます。</div>`}</section></div><section class="card" style="margin-top:14px"><h3>今日の予定を${sch?"変更":"登録"}</h3><div class="choice-row">${[...activeTimes(),"none"].map(v=>`<button class="choice ${sch?.value===v?"active":""}" ${lock?"disabled":""} onclick="familyChange('${v}')">${v==="none"?"乗らない":v}</button>`).join("")}</div></section>`}
function familyChange(v){const s=currentStudent(),old=getSchedule(DEMO_DAY,s.id)?.value||null;if(isLocked(DEMO_DAY)){toast("本日の受付は終了しています");return}openReason({day:DEMO_DAY,sid:s.id,newValue:v,oldValue:old,actorRole:session.role,actorName:session.name})}
function familyMonth(s){document.getElementById("familyContent").innerHTML=`<section class="card"><h2>今後約1か月の予定</h2><div class="day-list">${schoolDays().map(day=>{const sch=getSchedule(day,s.id);return `<div class="day-row"><b>${fmtDate(day)}</b><div>${statusLabel(sch,s)}</div><button class="btn secondary" ${isLocked(day)?"disabled":""} onclick="editDay('${day}','${s.id}')">変更</button></div>`}).join("")}</div></section>`}
function editDay(day,sid){const old=getSchedule(day,sid)?.value||null;modal(`<h2>${fmtDate(day)} の予定</h2><label>乗車予定</label><select id="dayVal">${[...db().times,"none"].map(v=>`<option value="${v}" ${v===old?"selected":""}>${v==="none"?"乗らない":v+"便"}</option>`).join("")}</select><div class="btn-group" style="margin-top:14px"><button class="btn" onclick="saveDay('${day}','${sid}','${old||""}')">次へ</button><button class="btn secondary" onclick="closeModal()">キャンセル</button></div>`)}
function saveDay(day,sid,old){const v=document.getElementById("dayVal").value;closeModal();openReason({day,sid,newValue:v,oldValue:old||null,actorRole:session.role,actorName:session.name})}
function familyRepeat(s){const d=db(),rep=d.repeats[s.id]||{1:"15:10",2:"15:10",3:"16:30",4:"16:30",5:"18:00"};document.getElementById("familyContent").innerHTML=`<section class="card"><h2>曜日ごとの繰り返し設定</h2><div class="notice">今後約1か月へ反映します。特定日の変更はその日だけ上書きします。</div>${[[1,"月"],[2,"火"],[3,"水"],[4,"木"],[5,"金"]].map(([k,l])=>`<div class="form-row" style="margin-bottom:8px"><div><b>${l}曜日</b></div><div><select id="rep${k}">${[...d.times,"none"].map(v=>`<option value="${v}" ${rep[k]===v?"selected":""}>${v==="none"?"乗らない":v+"便"}</option>`).join("")}</select></div></div>`).join("")}<button class="btn" onclick="saveRepeat('${s.id}')">今後1か月に反映</button></section>`}
function saveRepeat(sid){const d=db(),rep={};[1,2,3,4,5].forEach(k=>rep[k]=document.getElementById("rep"+k).value);d.repeats[sid]=rep;schoolDays().forEach(day=>{const dow=new Date(day+"T00:00:00").getDay(),existing=d.schedules[key(day,sid)];if(!existing||existing.by==="system")d.schedules[key(day,sid)]={value:rep[dow],status:"requested",by:"system",byName:"繰り返し設定",reason:"繰り返し設定",updatedAt:`${day} 07:00`,requestedAt:`${day} 07:00`}});recalcCapacity(d,DEMO_DAY);save(d);toast("繰り返し設定を反映しました");render()}
function familyProfile(s){const d=db(),r=d.routes.find(r=>r.id===s.routeId);document.getElementById("familyContent").innerHTML=`<section class="card"><h2>路線・降車場所</h2><div class="notice">本人・保護者から変更できます。変更履歴は保存されます。</div><div class="form-row"><div><label>路線</label><select id="profileRoute" onchange="refreshStopOptions()">${d.routes.map(x=>`<option value="${x.id}" ${x.id===s.routeId?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div><div><label>降車場所</label><select id="profileStop">${r.stops.map(x=>`<option ${x===s.stop?"selected":""}>${esc(x)}</option>`).join("")}</select></div></div><button class="btn" style="margin-top:12px" onclick="saveProfile('${s.id}')">変更を保存</button></section>`}
function refreshStopOptions(){const d=db(),r=d.routes.find(r=>r.id===document.getElementById("profileRoute").value);document.getElementById("profileStop").innerHTML=r.stops.map(x=>`<option>${esc(x)}</option>`).join("")}
function saveProfile(sid){const d=db(),s=d.students.find(x=>x.id===sid),oldRoute=s.routeId,oldStop=s.stop;s.routeId=document.getElementById("profileRoute").value;s.stop=document.getElementById("profileStop").value;logHistory(d,{sid,actorRole:session.role,actorName:session.name,action:"profile",oldValue:`${routeName(oldRoute)}／${oldStop}`,newValue:`${routeName(s.routeId)}／${s.stop}`,reason:"基本路線・降車場所の変更"});recalcCapacity(d,DEMO_DAY);save(d);toast("路線・降車場所を更新しました");render()}
function familyHistory(s){const rows=db().histories.filter(h=>h.sid===s.id).slice().reverse();document.getElementById("familyContent").innerHTML=`<section class="card"><h2>変更履歴</h2>${rows.length?`<div class="table-wrap"><table><thead><tr><th>日時</th><th>内容</th><th>変更者</th><th>理由</th></tr></thead><tbody>${rows.map(h=>`<tr><td>${esc(h.timestamp)}</td><td>${esc(h.oldValue||"未申告")} → ${esc(h.newValue||"")}</td><td>${esc(h.actorName)}（${roleLabel(h.actorRole)}）</td><td>${esc(h.reason||"")}${h.note?`<br><span class="small muted">${esc(h.note)}</span>`:""}</td></tr>`).join("")}</tbody></table></div>`:`<div class="muted">履歴はありません。</div>`}</section>`}
function openReason(x){const opts=["家庭の都合","迎えに変更","部活動等の予定変更","欠席・早退","その他"];modal(`<h2>変更理由</h2><div class="notice">${esc(x.oldValue||"未申告")} → <b>${esc(x.newValue==="none"?"乗らない":x.newValue)}</b></div><label>理由</label><select id="reasonSel">${opts.map(o=>`<option>${o}</option>`).join("")}</select><label style="margin-top:12px">自由記述</label><textarea id="reasonNote"></textarea><div class="btn-group"><button class="btn" onclick='confirmReason(${JSON.stringify(x)})'>保存</button><button class="btn secondary" onclick="closeModal()">キャンセル</button></div>`)}
function confirmReason(x){const reason=document.getElementById("reasonSel").value,note=document.getElementById("reasonNote").value.trim();if(reason==="その他"&&!note){toast("その他の場合は内容を入力してください");return}applyChange({...x,reason,note});closeModal();toast("予定を更新しました");render()}
function applyChange(x){const d=db(),s=d.students.find(st=>st.id===x.sid);d.schedules[key(x.day,x.sid)]={value:x.newValue,status:"requested",by:x.actorRole,byName:x.actorName,reason:x.reason,note:x.note||"",updatedAt:`${x.day} ${demoTime}`,requestedAt:`${x.day} ${demoTime}`};delete d.boarding[key(x.day,x.sid)];logHistory(d,{sid:x.sid,actorRole:x.actorRole,actorName:x.actorName,oldValue:x.oldValue||"未申告",newValue:x.newValue==="none"?"乗らない":x.newValue,reason:x.reason,note:x.note||""});recalcCapacity(d,x.day);save(d)}
function renderStaff(){app.innerHTML=topBar()+`<main class="container"><div class="tabs"><button class="btn ${currentTab==="today"?"":"secondary"}" onclick="staffTab('today')">今日の管理</button><button class="btn ${currentTab==="boarding"?"":"secondary"}" onclick="staffTab('boarding')">乗車確認</button><button class="btn ${currentTab==="pdf"?"":"secondary"}" onclick="staffTab('pdf')">PDF・教育委員会</button>${session.role==="admin"?`<button class="btn ${currentTab==="masters"?"":"secondary"}" onclick="staffTab('masters')">運行・定員設定</button><button class="btn ${currentTab==="accounts"?"":"secondary"}" onclick="staffTab('accounts')">アカウント管理</button>`:""}</div><div id="staffContent"></div></main>`;({today:staffToday,boarding:staffBoarding,pdf:staffPdf,masters:adminMasters,accounts:adminAccounts}[currentTab]||staffToday)()}
function staffTab(t){currentTab=t;render()}
function staffToday(){const d=db(),un=d.students.filter(s=>s.busCommuter&&!getSchedule(DEMO_DAY,s.id)),rejected=d.students.filter(s=>getSchedule(DEMO_DAY,s.id)?.status==="rejected");document.getElementById("staffContent").innerHTML=`<div class="grid grid-4">${d.times.map(t=>`<div class="stat"><div class="small muted">${t}便</div><b>${d.students.filter(s=>getSchedule(DEMO_DAY,s.id)?.value===t).length}</b>人</div>`).join("")}</div><div class="grid grid-2" style="margin-top:14px"><div class="card"><h3>未申告（バス通学者）</h3><div class="big">${un.length}人</div>${un.length?`<div class="notice danger">${un.map(s=>esc(s.name)).join("、")}</div>`:`<span class="pill ok">全員申告済み</span>`}</div><div class="card"><h3>満席・利用不可</h3><div class="big">${rejected.length}人</div>${rejected.length?`<div class="notice warn">${rejected.map(s=>esc(s.name)).join("、")}</div>`:`<span class="pill ok">対象なし</span>`}</div></div><section class="card" style="margin-top:14px"><h2>本日の乗車予定</h2><div class="table-wrap"><table><thead><tr><th>氏名</th><th>学年</th><th>区分</th><th>路線</th><th>予定</th><th>操作</th></tr></thead><tbody>${d.students.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${s.grade}年</td><td>${s.busCommuter?"バス通学":"一般利用"}</td><td>${esc(routeName(s.routeId))}</td><td>${statusLabel(getSchedule(DEMO_DAY,s.id),s)}</td><td><button class="btn secondary" onclick="staffEdit('${s.id}')">変更</button></td></tr>`).join("")}</tbody></table></div></section>`}
function staffEdit(sid){const d=db(),s=d.students.find(x=>x.id===sid),old=getSchedule(DEMO_DAY,sid)?.value||null;modal(`<h2>${esc(s.name)} の当日変更</h2><div class="small muted">${s.grade}年／${esc(routeName(s.routeId))}</div><label style="margin-top:12px">変更後</label><select id="staffNew">${[...activeTimes(),"none"].map(v=>`<option value="${v}" ${v===old?"selected":""}>${v==="none"?"乗らない":v+"便"}</option>`).join("")}</select><label style="margin-top:12px">変更理由</label><select id="staffReason"><option>保護者からの連絡</option><option>締切後の本人からの申し出</option><option>欠席・早退の確認</option><option>部活動予定の変更</option><option>学校行事・日程の変更</option><option>先生による登録訂正</option><option>その他</option></select><label style="margin-top:12px">備考</label><textarea id="staffNote"></textarea><div class="btn-group"><button class="btn" onclick="saveStaffEdit('${sid}','${old||""}')">保存</button><button class="btn secondary" onclick="closeModal()">キャンセル</button></div>`)}
function saveStaffEdit(sid,old){const v=document.getElementById("staffNew").value,reason=document.getElementById("staffReason").value,note=document.getElementById("staffNote").value.trim(),d=db(),s=d.students.find(x=>x.id===sid);const beforeRejected=d.students.filter(st=>getSchedule(DEMO_DAY,st.id)?.status==="rejected").map(st=>st.id);applyChange({day:DEMO_DAY,sid,newValue:v,oldValue:old||null,actorRole:session.role,actorName:session.name,reason,note});const nd=db(),afterRejected=nd.students.filter(st=>getSchedule(DEMO_DAY,st.id)?.status==="rejected").map(st=>st.id),newReject=afterRejected.filter(id=>!beforeRejected.includes(id));closeModal();if(newReject.length&&minOf(demoTime)>=minOf(nd.settings.deadline)){modal(`<h2>定員超過の確認</h2><div class="notice danger">この変更により一般利用者が定員超過になります。</div><p>除外候補：<b>${newReject.map(id=>esc(studentById(id)?.name)).join("、")}</b></p><p class="small muted">本番では先生が確認後に確定し、対象児童生徒へ通知します。</p><button class="btn" onclick="closeModal();render()">確認</button>`)}else{toast("変更を保存しました");render()}}
function initDraft(time){const d=db();boardingDraft[time]=boardingDraft[time]||{};d.students.filter(s=>getSchedule(DEMO_DAY,s.id)?.value===time&&getSchedule(DEMO_DAY,s.id)?.status!=="rejected").forEach(s=>{if(boardingDraft[time][s.id]===undefined)boardingDraft[time][s.id]=!!d.boarding[key(DEMO_DAY,s.id)]?.confirmed})}
function staffBoarding(){const d=db();document.getElementById("staffContent").innerHTML=`<section class="card"><h2>乗車確認</h2><div class="notice">チェックは「選択中」です。最後に各時刻の「乗車確認を確定」を押すまで保護者側には反映されません。18:00便は対象外です。</div>${d.times.filter(t=>t!=="18:00").map(time=>{initDraft(time);const riders=d.students.filter(s=>getSchedule(DEMO_DAY,s.id)?.value===time&&getSchedule(DEMO_DAY,s.id)?.status!=="rejected");return `<div class="card" style="margin-top:14px"><h2>${time}便</h2><div class="toolbar"><button class="btn ghost" onclick="selectAllTime('${time}',true)">この時刻を全員選択</button><button class="btn secondary" onclick="selectAllTime('${time}',false)">この時刻を全員解除</button><button class="btn ok" onclick="confirmBoarding('${time}')">${time}便の乗車確認を確定</button></div><div class="grid grid-2">${d.routes.map(route=>{const rs=riders.filter(s=>s.routeId===route.id);return `<div class="route-card card"><h3>${esc(route.name)} <span class="pill">${rs.length}人</span></h3><div class="toolbar"><button class="btn ghost" onclick="selectRoute('${time}','${route.id}',true)">路線全員選択</button><button class="btn secondary" onclick="selectRoute('${time}','${route.id}',false)">路線全員解除</button></div>${rs.length?rs.map(s=>`<label class="boarding-row ${boardingDraft[time][s.id]?"selected":""}"><input type="checkbox" ${boardingDraft[time][s.id]?"checked":""} onchange="setDraft('${time}','${s.id}',this.checked)"><span><b>${esc(s.name)}</b><br><span class="small muted">${d.boarding[key(DEMO_DAY,s.id)]?.confirmed?"前回確定済み":"未確定"}</span></span></label>`).join(""):`<div class="muted small">予定者なし</div>`}</div>`}).join("")}</div></div>`}).join("")}<h3 class="section-title">18:00便</h3><div class="notice">乗車確認対象外です。</div></section>`}
function setDraft(time,sid,val){initDraft(time);boardingDraft[time][sid]=val;render()}
function selectRoute(time,routeId,val){initDraft(time);db().students.filter(s=>s.routeId===routeId&&getSchedule(DEMO_DAY,s.id)?.value===time&&getSchedule(DEMO_DAY,s.id)?.status!=="rejected").forEach(s=>boardingDraft[time][s.id]=val);render()}
function selectAllTime(time,val){initDraft(time);Object.keys(boardingDraft[time]).forEach(id=>boardingDraft[time][id]=val);render()}
function confirmBoarding(time){initDraft(time);const d=db(),riders=d.students.filter(s=>getSchedule(DEMO_DAY,s.id)?.value===time&&getSchedule(DEMO_DAY,s.id)?.status!=="rejected"),selected=riders.filter(s=>boardingDraft[time][s.id]);const missing=riders.filter(s=>!boardingDraft[time][s.id]);modal(`<h2>${time}便 乗車確認</h2><div class="grid grid-3"><div class="stat"><span class="small muted">予定</span><br><b>${riders.length}</b>人</div><div class="stat"><span class="small muted">確認</span><br><b>${selected.length}</b>人</div><div class="stat"><span class="small muted">未確認</span><br><b>${missing.length}</b>人</div></div>${missing.length?`<div class="notice danger">未確認：${missing.map(s=>esc(s.name)).join("、")}</div>`:"<div class=\"notice ok\">全員選択されています。</div>"}<div class="btn-group"><button class="btn ok" onclick="commitBoarding('${time}')">この内容で確定</button><button class="btn secondary" onclick="closeModal()">戻る</button></div>`)}
function commitBoarding(time){const d=db();Object.entries(boardingDraft[time]||{}).forEach(([sid,val])=>{const k=key(DEMO_DAY,sid);if(val)d.boarding[k]={confirmed:true,time:demoTime,by:session.name};else delete d.boarding[k]});save(d);closeModal();toast(`${time}便の乗車確認を確定しました`);render()}
function staffPdf(){const d=db(),uns=d.students.filter(s=>s.busCommuter&&!getSchedule(DEMO_DAY,s.id)),sent=d.sent[DEMO_DAY];document.getElementById("staffContent").innerHTML=`<section class="card"><h2>教育委員会用PDF</h2>${uns.length?`<div class="notice danger">未申告者 ${uns.length}名：${uns.map(s=>esc(s.name)).join("、")}</div>`:`<div class="notice ok">全員申告済みです。</div>`}<div class="btn-group no-print"><button class="btn" onclick="window.print()">PDFプレビュー／印刷</button><button class="btn ok" onclick="markSent()">教育委員会へ送信（試作）</button></div>${sent?`<div class="small muted">最終送信：${esc(sent)}</div>`:""}<hr>${pdfBody()}</section>`}
function pdfBody(){const d=db();return `<div><h2>${fmtDate(DEMO_DAY)} スクールバス乗車予定</h2><div class="small">作成時刻：${demoTime} ／ v0.4試作</div>${d.times.map(t=>`<h3>${t}便</h3>${d.routes.map(r=>{const arr=d.students.filter(s=>s.routeId===r.id&&getSchedule(DEMO_DAY,s.id)?.value===t&&getSchedule(DEMO_DAY,s.id)?.status!=="rejected");return `<div><b>${esc(r.name)}</b>：${arr.length?arr.map(s=>esc(s.name)).join("、"):"なし"}</div>`}).join("")}`).join("")}<h3>乗らない</h3><div>${d.students.filter(s=>getSchedule(DEMO_DAY,s.id)?.value==="none").map(s=>esc(s.name)).join("、")||"なし"}</div><h3>未申告（バス通学者）</h3><div>${d.students.filter(s=>s.busCommuter&&!getSchedule(DEMO_DAY,s.id)).map(s=>esc(s.name)).join("、")||"なし"}</div></div>`}
function markSent(){if(!confirm("教育委員会への送信を模擬します。よろしいですか？"))return;const d=db();d.sent[DEMO_DAY]=`${DEMO_DAY} ${demoTime}（試作送信）`;save(d);toast("送信済みとして記録しました（実メールは送信しません）");render()}
function adminMasters(){const d=db();document.getElementById("staffContent").innerHTML=`<section class="card"><h2>運行・定員設定</h2><div class="notice">本番では適用開始日を持たせ、過去の路線・停留所・時刻は上書きしません。試作では当日設定のみ確認できます。</div><h3>固定便時刻</h3><div class="master-list">${d.times.map((t,i)=>`<div class="master-item"><span><b>${t}</b></span><button class="btn secondary" onclick="editTime(${i})">編集</button></div>`).join("")}</div><h3 class="section-title">路線・停留所</h3>${d.routes.map(r=>`<div class="card" style="margin-top:8px"><div class="master-item"><div><b>${esc(r.name)}</b><div class="small muted">${r.stops.map(esc).join(" → ")}</div></div><button class="btn secondary" onclick="editRoute('${r.id}')">編集</button></div></div>`).join("")}<h3 class="section-title">路線・便ごとの定員</h3><div class="table-wrap"><table><thead><tr><th>路線</th>${d.times.map(t=>`<th>${t}</th>`).join("")}</tr></thead><tbody>${d.routes.map(r=>`<tr><td><b>${esc(r.name)}</b></td>${d.times.map(t=>`<td><input type="number" min="0" value="${d.capacities[capKey(r.id,t)]}" onchange="setCapacity('${r.id}','${t}',this.value)"></td>`).join("")}</tr>`).join("")}</tbody></table></div><h3 class="section-title">受付設定</h3><div class="form-row"><div><label>未申告通知</label><input type="time" value="${d.settings.reminder}" onchange="setSetting('reminder',this.value)"></div><div><label>当日締切</label><input type="time" value="${d.settings.deadline}" onchange="setSetting('deadline',this.value)"></div></div><div class="btn-group" style="margin-top:16px"><button class="btn danger" onclick="resetDemo()">デモデータを初期化</button></div></section>`}
function setCapacity(routeId,time,val){const d=db();d.capacities[capKey(routeId,time)]=Math.max(0,Number(val)||0);recalcCapacity(d,DEMO_DAY);save(d);toast("定員を更新しました")}
function setSetting(k,v){const d=db();d.settings[k]=v;save(d);toast("設定を更新しました")}
function editTime(i){const d=db(),old=d.times[i];modal(`<h2>固定時刻の編集（試作）</h2><label>時刻</label><input id="newTime" type="time" value="${old}"><div class="btn-group" style="margin-top:12px"><button class="btn" onclick="saveTime(${i},'${old}')">保存</button><button class="btn secondary" onclick="closeModal()">キャンセル</button></div>`)}
function saveTime(i,old){const d=db(),v=document.getElementById("newTime").value;if(!v)return;d.times[i]=v;d.times.sort((a,b)=>minOf(a)-minOf(b));d.activeTimes[DEMO_DAY]=[...d.times];d.routes.forEach(r=>{if(d.capacities[capKey(r.id,v)]===undefined)d.capacities[capKey(r.id,v)]=6});save(d);closeModal();toast("時刻を更新しました（試作では過去履歴の分離は未実装）");render()}
function editRoute(id){const d=db(),r=d.routes.find(x=>x.id===id);modal(`<h2>路線・停留所編集</h2><label>路線名</label><input id="routeNameEdit" value="${esc(r.name)}"><label style="margin-top:12px">停留所（1行1件）</label><textarea id="routeStopsEdit">${r.stops.join("\n")}</textarea><div class="btn-group"><button class="btn" onclick="saveRoute('${id}')">保存</button><button class="btn secondary" onclick="closeModal()">キャンセル</button></div>`)}
function saveRoute(id){const d=db(),r=d.routes.find(x=>x.id===id);r.name=document.getElementById("routeNameEdit").value.trim()||r.name;r.stops=document.getElementById("routeStopsEdit").value.split(/\n/).map(x=>x.trim()).filter(Boolean);save(d);closeModal();toast("路線・停留所を更新しました");render()}
function adminAccounts(){const d=db();document.getElementById("staffContent").innerHTML=`<section class="card"><h2>アカウント管理</h2><div class="notice">児童生徒・保護者・先生・管理者は学校が発行します。児童生徒QRカードはA4 1枚につき最大10名（2列×5段）、先生用通知書はA4 1枚につき1名で出力します。</div><div class="btn-group" style="margin-bottom:16px"><button class="btn" onclick="printAllStudentNotices()">全家庭分 ID・PIN通知書PDF</button><button class="btn ghost" onclick="printStudentQrCards()">児童生徒QRカード一括PDF</button><button class="btn ghost" onclick="printAllTeacherNotices()">先生用通知書一括PDF</button></div><h3>児童生徒</h3><div class="table-wrap"><table><thead><tr><th>氏名</th><th>学年</th><th>区分</th><th>ID</th><th>PIN</th><th>QRトークン</th><th>操作</th></tr></thead><tbody>${d.students.map(s=>`<tr><td>${esc(s.name)}</td><td>${s.grade}年</td><td>${s.busCommuter?"バス通学":"一般利用"}</td><td>${s.id}</td><td>${s.pin}</td><td><span class="qr-token">${esc(s.qr)}</span></td><td><div class="btn-group"><button class="btn secondary" onclick="printStudentNotice('${s.id}')">通知書PDF</button><button class="btn secondary" onclick="reissueStudent('${s.id}')">再発行</button></div></td></tr>`).join("")}</tbody></table></div><h3 class="section-title">先生</h3><div class="table-wrap"><table><thead><tr><th>氏名</th><th>ID</th><th>PIN</th><th>QR</th><th>操作</th></tr></thead><tbody>${d.teacherAccounts.map(t=>`<tr><td>${esc(t.name)}</td><td>${t.id}</td><td>${t.pin}</td><td><span class="qr-token">${esc(t.qr)}</span></td><td><button class="btn secondary" onclick="printTeacherNotice('${t.id}')">通知書PDF</button></td></tr>`).join("")}</tbody></table></div><h3 class="section-title">管理者（3名）</h3><div class="table-wrap"><table><thead><tr><th>氏名</th><th>ID</th><th>PIN</th></tr></thead><tbody>${d.adminAccounts.map(a=>`<tr><td>${esc(a.name)}</td><td>${a.id}</td><td>${a.pin}</td></tr>`).join("")}</tbody></table></div><h3 class="section-title">ID・PIN通知書 文面</h3><textarea id="docText">${esc(d.settings.documentText)}</textarea><div class="btn-group" style="margin-top:10px"><button class="btn" onclick="saveDocText()">文面を保存</button><button class="btn secondary" onclick="previewAccountNotice()">QR入り通知書プレビュー</button></div><h3 class="section-title">年度更新</h3><div class="btn-group"><button class="btn ghost" onclick="toast('一括進級・卒業・新入生登録の試作ボタンです')">一括年度更新（試作）</button><button class="btn ghost" onclick="toast('転入・転出処理の試作ボタンです')">転入・転出（試作）</button></div></section>`}
function reissueStudent(sid){const d=db(),s=d.students.find(x=>x.id===sid);s.pin=Math.random().toString(36).slice(2,6).toUpperCase();s.qr=`QR-${sid}-${Math.random().toString(36).slice(2,8).toUpperCase()}`;logHistory(d,{sid,actorRole:session.role,actorName:session.name,oldValue:"旧PIN/QR",newValue:"再発行",reason:"ID・PIN・QR再発行"});save(d);toast("PIN・QRを再発行しました");render()}
function saveDocText(){const d=db();d.settings.documentText=document.getElementById("docText").value;save(d);toast("通知書文面を保存しました")}
function appBaseUrl(){return location.origin+location.pathname.replace(/[^/]*$/,"")}
function qrSvg(token,size=190){if(!window.LocalQR)throw new Error("QRコード生成ライブラリを読み込めませんでした");return LocalQR.toSvg(token,size,"M")}
function parentAccountsForStudent(sid){return PARENTS.filter(p=>p.studentId===sid)}
function printableCss(){return `
@page{size:A4;margin:14mm}*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#172b3a;margin:0}h1{font-size:22px;margin:0 0 10px}h2{font-size:18px;margin:14px 0 8px}.page{page-break-after:always;min-height:255mm;padding:2mm}.page:last-child{page-break-after:auto}.lead{white-space:pre-wrap;line-height:1.65;border-left:5px solid #2e6f95;background:#edf6fb;padding:10px 12px;margin:12px 0}.box{border:1px solid #b9c8d4;border-radius:10px;padding:12px;margin:10px 0}.account{display:grid;grid-template-columns:130px 1fr;gap:6px 12px}.label{font-weight:700}.qrwrap{display:flex;gap:18px;align-items:center;margin-top:14px}.qr{width:190px;min-width:190px}.note{font-size:12px;color:#5f6f7c;line-height:1.5}.token{font-family:ui-monospace,Consolas,monospace;font-size:11px;word-break:break-all}.parents{width:100%;border-collapse:collapse}.parents th,.parents td{border:1px solid #c8d3dc;padding:7px;text-align:left}.qr-card-page{page-break-after:always;display:grid;grid-template-columns:repeat(2,86mm);grid-template-rows:repeat(5,45mm);column-gap:4mm;row-gap:2mm;width:176mm;margin:0 auto}.qr-card-page:last-child{page-break-after:auto}.cut-card{display:flex;width:86mm;height:45mm;border:1px dashed #777;padding:3mm;align-items:center;gap:4mm;page-break-inside:avoid;overflow:hidden}.cut-card .qr{width:29mm;min-width:29mm}.cut-card .name{font-size:15px;font-weight:800}.cut-card .meta{font-size:10px;line-height:1.35}.qr-card-title{font-size:18px;margin:0 0 2mm}.qr-card-note{font-size:10px;color:#5f6f7c;margin:0 0 3mm}@media print{button{display:none}}`}
function openPrintWindow(title,body){const w=window.open("","_blank");if(!w){toast("ポップアップがブロックされました。許可してもう一度お試しください。",5000);return}w.document.open();w.document.write(`<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>${esc(title)}</title><style>${printableCss()}</style></head><body>${body}</body></html>`);w.document.close();setTimeout(()=>{w.focus();w.print()},300)}
function studentNoticeHtml(s){const d=db(),parents=parentAccountsForStudent(s.id),url=appBaseUrl();return `<article class="page"><h1>スクールバス乗車管理システム　ID・PIN通知書</h1><div class="lead">${esc(d.settings.documentText)}</div><div class="box"><h2>児童・生徒用</h2><div class="account"><div class="label">氏名</div><div>${esc(s.name)}（${s.grade}年）</div><div class="label">利用区分</div><div>${s.busCommuter?"バス通学":"一般利用"}</div><div class="label">ID</div><div><b>${esc(s.id)}</b></div><div class="label">PIN</div><div><b>${esc(s.pin)}</b></div><div class="label">基本路線</div><div>${esc(routeName(s.routeId))}</div><div class="label">降車場所</div><div>${esc(s.stop)}</div></div><div class="qrwrap"><div class="qr">${qrSvg(s.qr,190)}</div><div><b>受付用QRコード</b><p class="note">職員室前などのQR受付画面で使用します。QRコードにはID・PINではなく、受付用のランダムトークンを記録しています。</p><div class="token">${esc(s.qr)}</div></div></div></div><div class="box"><h2>保護者用アカウント</h2>${parents.length?`<table class="parents"><thead><tr><th>区分</th><th>ID</th><th>PIN</th></tr></thead><tbody>${parents.map((p,i)=>`<tr><td>保護者${i+1}</td><td><b>${esc(p.id)}</b></td><td><b>${esc(p.pin)}</b></td></tr>`).join("")}</tbody></table>`:"<div>保護者アカウントは登録されていません。</div>"}</div><div class="box"><div class="label">アプリURL</div><div>${esc(url)}</div><p class="note">ID・PIN・QRコードは第三者に渡さないでください。紛失した場合は学校へ連絡し、再発行を受けてください。</p></div></article>`}
function teacherNoticeHtml(t){const d=db(),url=appBaseUrl();return `<article class="page"><h1>スクールバス乗車管理システム　先生用ID・PIN通知書</h1><div class="lead">${esc(d.settings.documentText)}</div><div class="box"><div class="account"><div class="label">氏名</div><div>${esc(t.name)}</div><div class="label">ID</div><div><b>${esc(t.id)}</b></div><div class="label">PIN</div><div><b>${esc(t.pin)}</b></div></div><div class="qrwrap"><div class="qr">${qrSvg(t.qr,190)}</div><div><b>先生用QRコード</b><p class="note">共用端末で先生モードに入る際などに使用する想定です。本番ではQR＋PINなど、権限に応じた追加認証を行います。</p><div class="token">${esc(t.qr)}</div></div></div></div><div class="box"><div class="label">アプリURL</div><div>${esc(url)}</div></div></article>`}
function printStudentNotice(sid){const s=studentById(sid);if(!s)return;openPrintWindow(`${s.name}_ID_PIN通知書`,studentNoticeHtml(s))}
function printAllStudentNotices(){const d=db();openPrintWindow("全家庭_ID_PIN通知書",d.students.map(studentNoticeHtml).join(""))}
function printTeacherNotice(tid){const t=db().teacherAccounts.find(x=>x.id===tid);if(!t)return;openPrintWindow(`${t.name}_先生用通知書`,teacherNoticeHtml(t))}
function printAllTeacherNotices(){const d=db();openPrintWindow("先生用_ID_PIN通知書",d.teacherAccounts.map(teacherNoticeHtml).join(""))}
function printStudentQrCards(){const d=db();const pages=[];for(let i=0;i<d.students.length;i+=10){const group=d.students.slice(i,i+10);const cards=group.map(s=>`<div class="cut-card"><div class="qr">${qrSvg(s.qr,112)}</div><div><div class="name">${esc(s.name)}</div><div class="meta">${s.grade}年<br>${esc(routeName(s.routeId))}<br>ID：${esc(s.id)}<br><span class="token">${esc(s.qr)}</span></div></div></div>`).join("");pages.push(`<section class="page"><h1 class="qr-card-title">児童生徒 QRカード</h1><p class="qr-card-note">点線に沿って切り分けて使用する想定です。A4 1枚につき最大10名（2列×5段）です。</p><div class="qr-card-page">${cards}</div></section>`)}openPrintWindow("児童生徒_QRカード",pages.join(""))}
function previewAccountNotice(){const d=db(),s=d.students[0];modal(`<h2>QR入りID・PIN通知書（例）</h2><div style="display:grid;grid-template-columns:190px 1fr;gap:14px;align-items:start"><div>${qrSvg(s.qr,180)}</div><div><p>${esc(d.settings.documentText)}</p><p><b>児童生徒：</b>${esc(s.name)}</p><p><b>ID：</b>${esc(s.id)}　<b>PIN：</b>${esc(s.pin)}</p><p class="small muted">QR内容：${esc(s.qr)}</p></div></div><div class="btn-group"><button class="btn" onclick="closeModal();printStudentNotice('${s.id}')">この通知書をPDF出力</button><button class="btn secondary" onclick="closeModal()">閉じる</button></div>`)}
function renderReception(){if(displayTimer)clearInterval(displayTimer);const dl=minOf(db().settings.deadline),now=minOf(demoTime);if(now<dl){app.innerHTML=`<div class="reception-shell"><div class="reception-card"><div class="display-head"><div><div class="kicker">${fmtDate(DEMO_DAY)}</div><h1>QR受付専用画面</h1></div><button class="btn secondary" onclick="logout()">終了</button></div><div class="scan-area"><div class="scan-icon">▣</div><h2>QRコードをかざしてください</h2><p class="muted">受付締切 ${db().settings.deadline}</p><div class="form-row" style="max-width:600px;margin:18px auto 0"><div><label>デモ：QRトークン入力</label><input id="qrToken" placeholder="例 QR-S002-P9M4"></div><div style="display:flex;align-items:end"><button class="btn" style="width:100%" onclick="scanToken()">読み取る</button></div></div><div class="demo-box"><b>デモ用</b><div class="btn-group" style="margin-top:8px"><button class="btn secondary" onclick="demoScan('S002')">佐藤 花子</button><button class="btn secondary" onclick="demoScan('S004')">森 結衣（一般利用）</button><button class="btn secondary" onclick="demoScan('S010')">藤田 彩</button></div></div></div></div></div>`}else renderReceptionDisplay()}
function scanToken(){const tok=document.getElementById("qrToken").value.trim();const s=db().students.find(x=>x.qr===tok);if(!s){toast("QRを認識できませんでした");return}receptionChoice(s.id)}
function demoScan(sid){receptionChoice(sid)}
function receptionChoice(sid){const s=studentById(sid),sch=getSchedule(DEMO_DAY,sid);modal(`<h2>${esc(s.name)} ${s.grade}年</h2><div class="small muted">${esc(routeName(s.routeId))}／${esc(s.stop)}／${s.busCommuter?"バス通学":"一般利用"}</div><div class="choice-row" style="margin-top:14px">${[...activeTimes(),"none"].map(v=>`<button class="choice ${sch?.value===v?"active":""}" onclick="receptionRegister('${sid}','${v}')">${v==="none"?"乗らない":v}</button>`).join("")}</div><button class="btn secondary" style="margin-top:12px" onclick="closeModal()">キャンセル</button>`)}
function receptionRegister(sid,v){const old=getSchedule(DEMO_DAY,sid)?.value||null;applyChange({day:DEMO_DAY,sid,newValue:v,oldValue:old,actorRole:"student",actorName:studentById(sid).name,reason:"QR受付端末から登録",note:""});closeModal();toast("登録しました。3秒後に受付画面へ戻ります");setTimeout(()=>render(),1200)}
function nextUpcomingTimes(){const times=activeTimes().filter(t=>minOf(t)>minOf(demoTime));return times.length?times:activeTimes()}
function nearestDeparture(){const now=minOf(demoTime);return activeTimes().map(t=>({t,d:minOf(t)-now})).filter(x=>x.d>=0).sort((a,b)=>a.d-b.d)[0]||null}
function renderReceptionDisplay(){if(displayTimer)clearInterval(displayTimer);const near=nearestDeparture();if(near&&near.d<=10){const level=near.d<=5?"danger":"warn";app.innerHTML=`<div class="reception-display"><div class="display-head"><div><div class="small">${fmtDate(DEMO_DAY)}　本日の受付は終了しました</div><div class="display-time">${near.t}便</div></div><button class="btn secondary" onclick="logout()">終了</button></div><div class="countdown ${level}">出発${near.d===0?"時刻です":near.d+"分前"}</div><div class="notice" style="font-size:20px;text-align:center">${near.d<=5?"乗車予定の人は、乗車場所へ移動してください。":"下校準備をしてください。"}</div>${receptionRouteCounts(near.t)}<div class="display-footer"><div>氏名は表示しません。</div><div>デモ時刻 ${demoTime}</div></div></div>`;displayTimer=setInterval(renderReceptionDisplay,5000);return}const times=nextUpcomingTimes();if(displayIndex>=times.length)displayIndex=0;const time=times[displayIndex];app.innerHTML=`<div class="reception-display"><div class="display-head"><div><div class="small">${fmtDate(DEMO_DAY)}　本日の受付は終了しました</div><div class="display-time">${time}便</div></div><button class="btn secondary" onclick="logout()">終了</button></div>${receptionRouteCounts(time)}<div class="display-footer"><div>5秒ごとに便を切り替えます。氏名は表示しません。</div><div>デモ時刻 ${demoTime}</div></div></div>`;displayTimer=setInterval(()=>{displayIndex=(displayIndex+1)%times.length;renderReceptionDisplay()},5000)}
function receptionRouteCounts(time){const d=db();return `<div class="display-grid">${d.routes.map(r=>{const arr=d.students.filter(s=>s.routeId===r.id&&getSchedule(DEMO_DAY,s.id)?.value===time&&getSchedule(DEMO_DAY,s.id)?.status!=="rejected");return `<section class="display-route"><h2>${esc(r.name)}</h2><div class="big">${arr.length}人</div></section>`}).join("")}</div>`}
function renderDisplay(){if(displayTimer)clearInterval(displayTimer);const times=nextUpcomingTimes();if(displayIndex>=times.length)displayIndex=0;const time=times[displayIndex],d=db();app.innerHTML=`<div class="reception-display"><div class="display-head"><div><div class="small">${fmtDate(DEMO_DAY)}　本日の下校バス</div><div class="display-time">${time}便</div></div><button class="btn secondary" onclick="logout()">終了</button></div><div class="display-grid">${d.routes.map(r=>{const arr=d.students.filter(s=>s.routeId===r.id&&getSchedule(DEMO_DAY,s.id)?.value===time&&getSchedule(DEMO_DAY,s.id)?.status!=="rejected");return `<section class="display-route"><h2>${esc(r.name)} <span class="pill">${arr.length}人</span></h2><div class="display-names">${arr.length?arr.map(s=>`<div class="display-name">${s.grade}年　${esc(s.name)}</div>`).join(""):`<div class="muted">予定者なし</div>`}</div></section>`}).join("")}</div><div class="display-footer"><div>${time==="18:00"?"※18:00便は乗車確認対象外":"5秒ごとに便を切り替えます"}</div><div>デモ時刻 ${demoTime}</div></div></div>`;displayTimer=setInterval(()=>{displayIndex=(displayIndex+1)%times.length;renderDisplay()},5000)}
window.addEventListener("load",()=>{if("serviceWorker" in navigator)navigator.serviceWorker.register("./service-worker.js").catch(console.warn);render()});
</script>
</body>
</html>
