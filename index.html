<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173f5f">
<title>スクールバス乗車管理（試作版）</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f3f6f8;--card:#fff;--ink:#1f2933;--muted:#6b7785;--pri:#173f5f;--soft:#eaf1f6;--line:#d8e1e8;--ok:#2f855a;--warn:#b7791f;--danger:#c53030}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{display:flex;gap:9px;align-items:center;font-weight:900}.logo{width:38px;height:38px;border-radius:10px;background:var(--pri);color:#fff;display:grid;place-items:center}.wrap{width:min(1180px,calc(100% - 24px));margin:18px auto 40px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 7px 20px rgba(20,50,70,.08)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.btn{border:0;border-radius:11px;padding:10px 14px;background:var(--pri);color:#fff;font-weight:800;min-height:42px}.btn.sec{background:#fff;color:var(--pri);border:1px solid var(--line)}.btn.ok{background:var(--ok)}.btn.danger{background:var(--danger)}.btn:disabled{opacity:.45;cursor:not-allowed}.tabs{display:flex;gap:8px;overflow:auto;margin:12px 0}.pill{display:inline-block;border-radius:999px;padding:5px 9px;background:var(--soft);font-size:12px;font-weight:800}.pill.ok{background:#e4f4eb;color:#256448}.pill.warn{background:#fff5d9;color:#8a6517}.notice{padding:12px 14px;border-radius:10px;background:#edf6fb;border-left:5px solid #2e6f95;margin:10px 0}.notice.warn{background:#fff8e7;border-left-color:var(--warn)}.notice.danger{background:#fff0f0;border-left-color:var(--danger)}.big{font-size:38px;font-weight:950}.muted{color:var(--muted)}.small{font-size:13px}label{display:block;font-size:13px;font-weight:800;margin:10px 0 5px}input,select,textarea{width:100%;border:1px solid #bdcad5;border-radius:10px;padding:10px;background:#fff}textarea{min-height:80px}.choices{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}.choice{border:1px solid var(--line);border-radius:12px;padding:14px 7px;background:#fff;font-weight:900}.choice.active{background:var(--pri);color:#fff}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left}th{font-size:12px;color:var(--muted);background:#f8fafb}.stat{background:var(--soft);border-radius:12px;padding:12px}.stat b{font-size:24px}.check{display:flex;gap:9px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px;margin:6px 0}.check.done{background:#e9f7ef}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(520px,100%);background:#fff;padding:22px;border:1px solid var(--line);border-radius:20px;box-shadow:0 7px 20px rgba(20,50,70,.08)}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.modalback{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:30;padding:16px}.modal{background:#fff;border-radius:18px;padding:18px;width:min(600px,100%);max-height:90vh;overflow:auto}.toast{position:fixed;right:16px;bottom:16px;z-index:40;background:#142d3f;color:#fff;padding:13px 16px;border-radius:12px;max-width:min(420px,calc(100% - 32px));font-weight:700}.display{min-height:100vh;background:#0f2f48;color:#fff;padding:22px}.displayHead{display:flex;justify-content:space-between;gap:10px;align-items:center}.displayTime{font-size:clamp(52px,10vw,100px);font-weight:950}.displayGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.route{background:#fff;color:#172b3a;border-radius:18px;padding:16px}.names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.name{background:#eaf1f6;padding:9px;border-radius:10px;font-weight:900}.footer{margin-top:14px;display:flex;justify-content:space-between;gap:10px;opacity:.9}
@media(max-width:820px){.grid,.grid4,.displayGrid{grid-template-columns:1fr}.choices{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media print{.top,.tabs,.noprint,.btn{display:none!important}.wrap{width:100%;margin:0}.card{box-shadow:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast hidden"></div>
<script>
"use strict";
const ROUTES=["天坪方面","立川・川口方面","岩原・豊永方面","西峰・大田口・穴内方面"];
const TIMES=["13:30","15:10","16:30","18:00"];
const DAY="2026-10-05";
const students=[
{id:"S001",pin:"A1B2",name:"山田 太郎",grade:"4年",route:ROUTES[0],stop:"馬瀬"},
{id:"S002",pin:"B2C3",name:"佐藤 花子",grade:"6年",route:ROUTES[0],stop:"万手野"},
{id:"S003",pin:"C3D4",name:"高橋 海斗",grade:"7年",route:ROUTES[0],stop:"新大王橋"},
{id:"S004",pin:"D4E5",name:"森 結衣",grade:"9年",route:ROUTES[0],stop:"馬瀬古屋"},
{id:"S005",pin:"E5F6",name:"小川 蓮",grade:"5年",route:ROUTES[1],stop:"川口"},
{id:"S006",pin:"F6G7",name:"岡田 美咲",grade:"8年",route:ROUTES[1],stop:"津家"},
{id:"S007",pin:"G7H8",name:"中村 翼",grade:"3年",route:ROUTES[1],stop:"野竹橋"},
{id:"S008",pin:"H8J9",name:"井上 葵",grade:"9年",route:ROUTES[1],stop:"大杉橋元"},
{id:"S009",pin:"J9K1",name:"松本 悠真",grade:"4年",route:ROUTES[2],stop:"柳野"},
{id:"S010",pin:"K1L2",name:"藤田 彩",grade:"7年",route:ROUTES[2],stop:"豊永公民館"},
{id:"S011",pin:"L2M3",name:"山本 蒼",grade:"8年",route:ROUTES[2],stop:"穴内"},
{id:"S012",pin:"M3N4",name:"清水 凛",grade:"6年",route:ROUTES[2],stop:"川戸"},
{id:"S013",pin:"N4P5",name:"田中 陽翔",grade:"5年",route:ROUTES[3],stop:"豊永駅"},
{id:"S014",pin:"P5Q6",name:"前田 莉子",grade:"8年",route:ROUTES[3],stop:"大田口駅"},
{id:"S015",pin:"Q6R7",name:"池田 健",grade:"2年",route:ROUTES[3],stop:"落合"},
{id:"S016",pin:"R7S8",name:"西村 心",grade:"9年",route:ROUTES[3],stop:"ふれあいセンター"}
];
const parents=[{id:"P001",pin:"P1A1",name:"山田 保護者①",sid:"S001"},{id:"P002",pin:"P1A2",name:"山田 保護者②",sid:"S001"}];
const staff=[{id:"T001",pin:"T1E1",name:"一般教員A",role:"teacher"},{id:"A001",pin:"A1D1",name:"管理者A",role:"admin"}];
let session=null,tab="today",demo="08:35",displayTimer=null,displayIndex=0;
try{session=JSON.parse(sessionStorage.getItem("busSession")||"null");demo=localStorage.getItem("demoTime")||"08:35"}catch(e){session=null}
const app=document.getElementById("app");
function K(d,s){return d+"__"+s}
function min(t){const p=t.split(":").map(Number);return p[0]*60+p[1]}
function fmt(d){const x=new Date(d+"T00:00:00");return `${x.getMonth()+1}月${x.getDate()}日（${"日月火水木金土"[x.getDay()]}）`}
function add(d,n){const x=new Date(d+"T00:00:00");x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function DB(){
  try{const raw=localStorage.getItem("schoolBusProtoV03");if(raw)return JSON.parse(raw)}catch(e){}
  const d={s:{},r:{},b:{},h:[],active:{},sent:{}};d.active[DAY]=TIMES.slice();
  const seed={S001:"15:10",S003:"18:00",S004:"18:00",S005:"13:30",S006:"16:30",S007:"15:10",S008:"18:00",S009:"16:30",S011:"18:00",S012:"13:30",S013:"15:10",S014:"18:00",S015:"16:30",S016:"18:00"};
  Object.entries(seed).forEach(([sid,v])=>{d.s[K(DAY,sid)]={v,who:"繰り返し設定",role:"system",reason:"繰り返し設定",at:DAY+" 07:00"}});
  save(d);return d;
}
function save(d){localStorage.setItem("schoolBusProtoV03",JSON.stringify(d))}
function sched(d,s){return DB().s[K(d,s)]||null}
function board(d,s){return DB().b[K(d,s)]||null}
function active(d=DAY){return DB().active[d]||TIMES.slice()}
function locked(d){return d===DAY&&min(demo)>=min("08:50")}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.remove("hidden");clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.add("hidden"),3500)}
function modal(html){const x=document.createElement("div");x.id="modal";x.className="modalback";x.innerHTML=`<div class="modal">${html}</div>`;document.body.appendChild(x)}
function closeM(){document.getElementById("modal")?.remove()}
function loginView(){
  app.innerHTML=`<div class="login"><div class="loginbox"><div class="brand"><div class="logo">🚌</div><div>スクールバス乗車管理<br><span class="muted small">PWA 試作版 v0.3</span></div></div><div class="notice">実在の児童生徒データは使用していません。データはこのブラウザ内だけに保存されます。</div><label>ユーザーID</label><input id="id" placeholder="例 S001"><label>4桁英数PIN</label><input id="pin" maxlength="4" placeholder="例 A1B2"><button class="btn" style="width:100%;margin-top:12px" onclick="login()">ログイン</button><div class="card" style="margin-top:16px"><b>デモ用ログイン</b><div class="quick"><button class="btn sec" onclick="quick('S001','A1B2')">児童・生徒</button><button class="btn sec" onclick="quick('P001','P1A1')">保護者</button><button class="btn sec" onclick="quick('T001','T1E1')">一般教員</button><button class="btn sec" onclick="quick('A001','A1D1')">管理者</button></div><button class="btn sec" style="width:100%;margin-top:8px" onclick="displayLogin()">玄関ディスプレイ</button></div></div></div>`;
}
function quick(i,p){document.getElementById("id").value=i;document.getElementById("pin").value=p;login()}
function login(){
  const i=document.getElementById("id").value.trim().toUpperCase();const p=document.getElementById("pin").value.trim().toUpperCase();let u=students.find(x=>x.id===i&&x.pin===p);
  if(u)session={id:u.id,name:u.name,role:"student"};
  if(!u){u=parents.find(x=>x.id===i&&x.pin===p);if(u)session={id:u.id,name:u.name,role:"parent"}}
  if(!u){u=staff.find(x=>x.id===i&&x.pin===p);if(u)session={id:u.id,name:u.name,role:u.role}}
  if(!u){toast("IDまたはPINが違います");return}
  sessionStorage.setItem("busSession",JSON.stringify(session));tab="today";render();
}
function displayLogin(){session={id:"DISPLAY",name:"玄関表示",role:"display"};sessionStorage.setItem("busSession",JSON.stringify(session));render()}
function logout(){clearInterval(displayTimer);session=null;sessionStorage.removeItem("busSession");loginView()}
function top(){return `<div class="top"><div class="brand"><div class="logo">🚌</div><div>スクールバス</div></div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="pill">${session.name}</span><select style="width:auto" onchange="setTime(this.value)">${["08:35","08:45","09:10","13:20","15:00","16:20","17:50"].map(t=>`<option ${t===demo?"selected":""}>${t}</option>`).join("")}</select><button class="btn sec" onclick="logout()">ログアウト</button></div></div>`}
function setTime(v){demo=v;localStorage.setItem("demoTime",v);render()}
function person(){if(session.role==="student")return students.find(s=>s.id===session.id);const p=parents.find(x=>x.id===session.id);return students.find(s=>s.id===p?.sid)}
function status(v){if(!v)return '<span class="pill warn">未申告</span>';if(v==="none")return '<span class="pill">乗らない</span>';return `<span class="pill ok">${v}便</span>`}
function render(){if(!session){loginView();return}if(session.role==="display"){renderDisplay();return}if(session.role==="student"||session.role==="parent")family();else staffView();remind()}
function remind(){if(!(session.role==="student"||session.role==="parent"))return;const s=person();if(!s)return;const m=min(demo);if(!sched(DAY,s.id)&&m>=min("08:40")&&m<min("08:50"))setTimeout(()=>toast("⚠ 本日のスクールバス申告が未完了です。8:50までに登録してください。"),200)}
function family(){const s=person();if(!s){logout();return}app.innerHTML=top()+`<main class="wrap"><div><b>${s.name}</b> <span class="muted">${s.grade}／${s.route}／${s.stop}</span></div><div class="tabs"><button class="btn ${tab==='today'?'':'sec'}" onclick="go('today')">今日</button><button class="btn ${tab==='month'?'':'sec'}" onclick="go('month')">1か月予定</button><button class="btn ${tab==='repeat'?'':'sec'}" onclick="go('repeat')">繰り返し</button><button class="btn ${tab==='history'?'':'sec'}" onclick="go('history')">変更履歴</button></div><div id="content"></div></main>`;const map={today:familyToday,month:familyMonth,repeat:familyRepeat,history:familyHistory};map[tab](s)}
function go(t){tab=t;render()}
function familyToday(s){const q=sched(DAY,s.id),b=board(DAY,s.id),lock=locked(DAY);let bh="";if(q?.v==="18:00")bh='<div class="notice">18:00便は学校による乗車確認の対象外です。</div>';else if(b?.ok)bh=`<div class="notice"><b>🟢 ${b.time} 乗車確認済み</b></div>`;else if(q?.v&&q.v!=="none")bh='<div class="notice warn">乗車予定（まだ乗車確認前です）</div>';document.getElementById("content").innerHTML=`${!q?`<div class="notice danger"><b>本日の申告が未完了です。</b>${lock?' 8:50以降は学校へ連絡してください。':''}</div>`:''}<div class="grid"><div class="card"><div class="muted small">${fmt(DAY)}</div><div class="big">${q?.v==='none'?'乗らない':q?.v?q.v+'便':'未申告'}</div><div>${s.route}／降車 ${s.stop}</div>${q?.at?`<div class="muted small">最終更新 ${q.at}　${q.who}</div>`:''}${lock?'<div class="notice warn">当日分の本人・保護者による変更受付は8:50で終了しています。</div>':''}</div><div class="card"><h3>乗車状況</h3>${bh||'<div class="muted">乗車予定登録後に表示されます。</div>'}</div></div><div class="card"><h3>今日の予定</h3><div class="choices">${[...active(DAY),'none'].map(v=>`<button class="choice ${q?.v===v?'active':''}" ${lock?'disabled':''} onclick="familyChange('${v}')">${v==='none'?'乗らない':v}</button>`).join('')}</div></div>`}
function familyChange(v){const s=person(),old=sched(DAY,s.id)?.v||null;if(locked(DAY)){toast("本日の変更受付は終了しています");return}reasonModal(DAY,s.id,v,old,session.role,session.name)}
function days(){const a=[];let d=DAY;for(let i=0;a.length<22&&i<50;i++,d=add(d,1)){const w=new Date(d+'T00:00:00').getDay();if(w!==0&&w!==6)a.push(d)}return a}
function familyMonth(s){document.getElementById("content").innerHTML=`<div class="card"><h2>今後約1か月の予定</h2>${days().map(d=>`<div style="display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;padding:10px;border-bottom:1px solid var(--line)"><b>${fmt(d)}</b><div>${status(sched(d,s.id)?.v)}</div><button class="btn sec" ${locked(d)?'disabled':''} onclick="editDay('${d}','${s.id}')">変更</button></div>`).join('')}</div>`}
function editDay(d,sid){const old=sched(d,sid)?.v||null;modal(`<h2>${fmt(d)}</h2><label>乗車予定</label><select id="nv">${[...TIMES,'none'].map(v=>`<option value="${v}" ${old===v?'selected':''}>${v==='none'?'乗らない':v+'便'}</option>`).join('')}</select><button class="btn" style="margin-top:12px" onclick="editDay2('${d}','${sid}','${old||''}')">次へ</button> <button class="btn sec" onclick="closeM()">キャンセル</button>`)}
function editDay2(d,sid,old){const v=document.getElementById("nv").value;closeM();reasonModal(d,sid,v,old||null,session.role,session.name)}
function familyRepeat(s){const d=DB(),r=d.r[s.id]||{1:'15:10',2:'15:10',3:'16:30',4:'16:30',5:'18:00'};document.getElementById("content").innerHTML=`<div class="card"><h2>曜日ごとの繰り返し設定</h2><div class="notice">今後約1か月の授業日に反映します。特定日の変更はその日だけ上書きします。</div>${[['1','月'],['2','火'],['3','水'],['4','木'],['5','金']].map(([k,l])=>`<div style="display:grid;grid-template-columns:100px 1fr;gap:10px;align-items:center;margin:8px 0"><b>${l}曜日</b><select id="r${k}">${[...TIMES,'none'].map(v=>`<option value="${v}" ${r[k]===v?'selected':''}>${v==='none'?'乗らない':v+'便'}</option>`).join('')}</select></div>`).join('')}<button class="btn" onclick="saveRepeat('${s.id}')">今後1か月に反映</button></div>`}
function saveRepeat(sid){const d=DB(),r={};['1','2','3','4','5'].forEach(k=>r[k]=document.getElementById('r'+k).value);d.r[sid]=r;days().forEach(day=>{const w=String(new Date(day+'T00:00:00').getDay()),e=d.s[K(day,sid)];if(!e||e.role==='system')d.s[K(day,sid)]={v:r[w],who:'繰り返し設定',role:'system',reason:'繰り返し設定',at:day+' 07:00'}});save(d);toast('繰り返し設定を反映しました');render()}
function familyHistory(s){const a=DB().h.filter(x=>x.sid===s.id).slice().reverse();document.getElementById("content").innerHTML=`<div class="card"><h2>変更履歴</h2>${a.length?`<div class="table"><table><tr><th>日時</th><th>対象日</th><th>変更</th><th>変更者</th><th>理由</th></tr>${a.map(x=>`<tr><td>${x.at}</td><td>${fmt(x.day)}</td><td>${x.old||'未申告'} → ${x.val==='none'?'乗らない':x.val}</td><td>${x.who}</td><td>${x.reason}${x.note?'<br><span class="muted small">'+x.note+'</span>':''}</td></tr>`).join('')}</table></div>`:'<div class="muted">履歴はまだありません。</div>'}</div>`}
function reasonModal(day,sid,val,old,role,who){const opts=["家庭の都合","迎えに変更","部活動等の予定変更","欠席・早退","その他"];modal(`<h2>変更理由</h2><div class="notice">${old||'未申告'} → <b>${val==='none'?'乗らない':val}</b></div><label>理由</label><select id="reason">${opts.map(x=>`<option>${x}</option>`).join('')}</select><label>自由記述（任意）</label><textarea id="note"></textarea><button class="btn" onclick="saveReason('${day}','${sid}','${val}','${old||''}','${role}','${who}')">保存</button> <button class="btn sec" onclick="closeM()">キャンセル</button>`)}
function saveReason(day,sid,val,old,role,who){const r=document.getElementById("reason").value,n=document.getElementById("note").value.trim();if(r==='その他'&&!n){toast('「その他」の場合は自由記述を入力してください');return}apply({day,sid,val,old:old||null,role,who,reason:r,note:n});closeM();toast('更新しました');render()}
function apply(x){const d=DB();d.s[K(x.day,x.sid)]={v:x.val,who:x.who,role:x.role,reason:x.reason,note:x.note||'',at:x.day+' '+demo};delete d.b[K(x.day,x.sid)];d.h.push({...x,at:x.day+' '+demo});save(d)}
function staffView(){app.innerHTML=top()+`<main class="wrap"><div class="tabs"><button class="btn ${tab==='today'?'':'sec'}" onclick="go('today')">今日の管理</button><button class="btn ${tab==='boarding'?'':'sec'}" onclick="go('boarding')">乗車確認</button><button class="btn ${tab==='pdf'?'':'sec'}" onclick="go('pdf')">PDF・教育委員会</button>${session.role==='admin'?`<button class="btn ${tab==='admin'?'':'sec'}" onclick="go('admin')">管理者設定</button>`:''}</div><div id="content"></div></main>`;const map={today:staffToday,boarding:staffBoard,pdf:staffPdf,admin:adminView};map[tab]()}
function count(){const c={un:0,none:0};TIMES.forEach(t=>c[t]=0);students.forEach(s=>{const v=sched(DAY,s.id)?.v;if(!v)c.un++;else if(v==='none')c.none++;else c[v]++});return c}
function staffToday(){const c=count();document.getElementById("content").innerHTML=`<div class="grid4">${TIMES.map(t=>`<div class="stat"><span class="muted">${t}便</span><br><b>${c[t]}</b>人</div>`).join('')}</div><div class="grid" style="margin-top:14px"><div class="card"><h3>未申告</h3><div class="big">${c.un}人</div>${c.un?'<div class="notice danger">8:40に本人へ通知する想定です。</div>':'<span class="pill ok">全員申告済み</span>'}</div><div class="card"><h3>乗らない</h3><div class="big">${c.none}人</div></div></div><div class="card"><h2>本日の乗車予定</h2><div class="table"><table><tr><th>氏名</th><th>学年</th><th>路線</th><th>予定</th><th>更新者</th><th></th></tr>${students.map(s=>{const q=sched(DAY,s.id);return `<tr><td><b>${s.name}</b></td><td>${s.grade}</td><td>${s.route}</td><td>${status(q?.v)}</td><td>${q?.who||'—'}</td><td><button class="btn sec" onclick="staffEdit('${s.id}')">変更</button></td></tr>`}).join('')}</table></div></div>`}
function staffEdit(sid){const s=students.find(x=>x.id===sid),old=sched(DAY,sid)?.v||null;modal(`<h2>${s.name} の当日変更</h2><label>変更後</label><select id="sv">${[...active(DAY),'none'].map(v=>`<option value="${v}" ${old===v?'selected':''}>${v==='none'?'乗らない':v+'便'}</option>`).join('')}</select><label>変更理由</label><select id="sr">${["保護者からの連絡","締切後の本人からの申し出","欠席・早退の確認","部活動予定の変更","学校行事・日程の変更","教職員による登録訂正","その他"].map(x=>`<option>${x}</option>`).join('')}</select><label>備考（任意）</label><textarea id="sn"></textarea><button class="btn" onclick="saveStaff('${sid}','${old||''}')">保存</button> <button class="btn sec" onclick="closeM()">キャンセル</button>`)}
function saveStaff(sid,old){apply({day:DAY,sid,val:document.getElementById("sv").value,old:old||null,role:session.role,who:session.name,reason:document.getElementById("sr").value,note:document.getElementById("sn").value.trim()});closeM();toast('変更を保存しました');render()}
function staffBoard(){document.getElementById("content").innerHTML=`<div class="card"><h2>乗車確認</h2><div class="notice">18:00便は乗車確認対象外です。</div>${['13:30','15:10','16:30'].map(t=>`<h3>${t}便</h3><div class="grid">${ROUTES.map(r=>{const a=students.filter(s=>s.route===r&&sched(DAY,s.id)?.v===t);return `<div class="card"><b>${r}</b> <span class="pill">${a.length}人</span>${a.length?a.map(s=>{const b=board(DAY,s.id);return `<label class="check ${b?.ok?'done':''}"><input style="width:auto" type="checkbox" ${b?.ok?'checked':''} onchange="toggleB('${s.id}',this.checked)"><span><b>${s.name}</b><br><span class="small muted">${b?.ok?b.time+' 確認済':'未確認'}</span></span></label>`}).join(''):'<div class="muted small">予定者なし</div>'}</div>`}).join('')}</div>`).join('')}<h3>18:00便</h3><div class="notice">中学生の部活動後便のため、学校による乗車確認を行いません。</div></div>`}
function toggleB(sid,on){const d=DB();if(on)d.b[K(DAY,sid)]={ok:true,time:demo,who:session.name};else delete d.b[K(DAY,sid)];save(d);render()}
function staffPdf(){const uns=students.filter(s=>!sched(DAY,s.id)),sent=DB().sent[DAY];document.getElementById("content").innerHTML=`<div class="card"><h2>教育委員会用PDF</h2>${uns.length?`<div class="notice danger">⚠ 未申告 ${uns.length}名：${uns.map(s=>s.name).join('、')}</div>`:'<div class="notice">全員申告済みです。</div>'}<div class="noprint"><button class="btn" onclick="window.print()">PDFプレビュー／印刷</button> <button class="btn ok" onclick="sendMock()">教育委員会へ送信（試作）</button></div>${sent?`<div class="muted small">最終送信記録 ${sent}</div>`:''}<hr><h2>${fmt(DAY)} スクールバス乗車予定</h2><div class="muted small">作成時刻 ${demo}</div>${TIMES.map(t=>`<h3>${t}便</h3>${ROUTES.map(r=>{const a=students.filter(s=>s.route===r&&sched(DAY,s.id)?.v===t);return `<div><b>${r}</b>：${a.length?a.map(s=>s.name).join('、'):'なし'}</div>`}).join('')}`).join('')}<h3>乗らない</h3><div>${students.filter(s=>sched(DAY,s.id)?.v==='none').map(s=>s.name).join('、')||'なし'}</div><h3>未申告</h3><div>${uns.map(s=>s.name).join('、')||'なし'}</div></div>`}
function sendMock(){const u=students.filter(s=>!sched(DAY,s.id));if(u.length&&!confirm('未申告者がいます。このまま試作送信しますか？'))return;if(!confirm('教育委員会へ送信する操作を模擬します。よろしいですか？'))return;const d=DB();d.sent[DAY]=DAY+' '+demo+'（試作送信）';save(d);toast('送信済みとして記録しました。実際のメールは送信していません');render()}
function adminView(){const a=active(DAY);document.getElementById("content").innerHTML=`<div class="card"><h2>管理者設定</h2><h3>本日の運行便</h3><div class="notice">通常は4便を自動設定し、学校行事など例外日のみ変更する想定です。</div>${TIMES.map(t=>`<button class="btn ${a.includes(t)?'ok':'sec'}" onclick="toggleA('${t}')">${t} ${a.includes(t)?'運行':'運休'}</button> `).join('')}<hr><h3>権限</h3><div class="table"><table><tr><th>利用者</th><th>主な権限</th></tr><tr><td>児童・生徒</td><td>自分の予定登録・変更</td></tr><tr><td>保護者</td><td>紐付く1名の予定登録・確認</td></tr><tr><td>一般教員</td><td>締切後変更・乗車確認</td></tr><tr><td>管理者</td><td>運行便設定・アカウント・PDF等</td></tr></table></div><hr><button class="btn danger" onclick="resetDemo()">デモデータ初期化</button></div>`}
function toggleA(t){const d=DB(),a=d.active[DAY]||TIMES.slice();d.active[DAY]=a.includes(t)?a.filter(x=>x!==t):[...a,t].sort((x,y)=>min(x)-min(y));save(d);render()}
function resetDemo(){if(confirm('初期化しますか？')){localStorage.removeItem('schoolBusProtoV03');DB();render()}}
function renderDisplay(){clearInterval(displayTimer);let list=active(DAY).filter(t=>min(t)>min(demo));if(!list.length)list=active(DAY);if(displayIndex>=list.length)displayIndex=0;const t=list[displayIndex],riders=students.filter(s=>sched(DAY,s.id)?.v===t);app.innerHTML=`<div class="display"><div class="displayHead"><div><div>${fmt(DAY)}　本日の下校バス</div><div class="displayTime">${t}便</div></div><button class="btn sec" onclick="logout()">終了</button></div><div class="displayGrid">${ROUTES.map(r=>{const a=riders.filter(s=>s.route===r);return `<div class="route"><h2>${r} <span class="pill">${a.length}人</span></h2><div class="names">${a.length?a.map(s=>`<div class="name">${s.grade}　${s.name}</div>`).join(''):'<div class="muted">予定者なし</div>'}</div></div>`}).join('')}</div><div class="footer"><div>${t==='18:00'?'※ 18:00便は教職員による乗車確認を行いません。':'5秒ごとに便を自動切替します。'}</div><div>デモ時刻 ${demo}　${displayIndex+1}/${list.length}</div></div></div>`;displayTimer=setInterval(()=>{displayIndex=(displayIndex+1)%list.length;renderDisplay()},5000)}
window.addEventListener("load",()=>{try{render()}catch(e){app.innerHTML=`<div class="login"><div class="loginbox"><h2>起動エラー</h2><div class="notice danger">${String(e.message||e)}</div><button class="btn" onclick="sessionStorage.clear();localStorage.removeItem('schoolBusProtoV03');location.reload()">初期化して再読込</button></div></div>`;console.error(e)}if('serviceWorker' in navigator)navigator.serviceWorker.register('./service-worker.js').catch(()=>{})});
</script>
</body>
</html>
